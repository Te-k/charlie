{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
  <h1 class="mb-6 font-serif text-3xl font-bold">{{ title }}</h1>
  <form method="post" novalidate class="card">
    {% csrf_token %}
    {% for field in form %}{% include "articles/_form_field.html" %}{% endfor %}
    <div class="flex gap-3">
      <button type="submit" class="btn-primary">Add</button>
      <a href="{{ cancel_url }}" class="btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, django, simplify
select = ["F", "E", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["articles", "social", "charlie"]
